# The only production deployment for https://subashgauchan16.github.io/SubashGauchan-Data-Analytics-Portfolio/
#
# Owner: this workflow. It publishes the site/ folder and nothing else, so the workbooks
# in data/, the notes in docs/ and the archives in reference/ are never part of the website.
# (They are still public in this repository; a folder name is not a security boundary.)
#
# Requires: Settings → Pages → Build and deployment → Source = "GitHub Actions".
# With "Deploy from a branch", GitHub also runs its own pages-build-deployment job, which
# would publish the repository root through Jekyll and race this workflow.
#
# Retired: .github/workflows/static.yml (same trigger, same concurrency group, so the two
# cancelled each other) and the inert root pages.yml. Both are kept in reference/deploy-history/.
name: Deploy static portfolio to GitHub Pages

on:
  push:
    branches: ["main-2"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check the site before publishing
        run: python3 tools/check_site.py site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
