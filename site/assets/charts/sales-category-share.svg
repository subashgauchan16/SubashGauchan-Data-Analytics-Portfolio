<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
<title id="title">Exploratory revenue mix by product category</title><desc id="desc">Bikes represent approximately 72.5 percent and all other categories 27.5 percent of revenue in the workbook-derived grouping. These are preliminary results, not independently validated.</desc>
<rect width="1000" height="360" rx="22" fill="#f4f7fb"/><text x="38" y="48" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#17365d">REVENUE MIX · WORKBOOK-DERIVED</text>
<circle cx="220" cy="196" r="82" fill="none" stroke="#dce4ee" stroke-width="30"/><circle cx="220" cy="196" r="82" fill="none" stroke="#2d6a9f" stroke-width="30" stroke-dasharray="373.6 515.2" transform="rotate(-90 220 196)"/>
<circle cx="220" cy="196" r="53" fill="#f4f7fb"/><text x="220" y="191" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#17365d">72.5%</text><text x="220" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#52637a">Bikes</text>
<rect x="390" y="126" width="18" height="18" rx="4" fill="#2d6a9f"/><text x="425" y="141" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17365d">Bikes · 72.5%</text><text x="425" y="166" font-family="Arial,sans-serif" font-size="15" fill="#52637a">Largest reported revenue category</text>
<rect x="390" y="204" width="18" height="18" rx="4" fill="#dce4ee"/><text x="425" y="219" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17365d">Other categories · 27.5%</text><text x="425" y="244" font-family="Arial,sans-serif" font-size="15" fill="#52637a">Combined remainder of revenue</text>
<text x="38" y="306" font-family="Arial,sans-serif" font-size="13" fill="#52637a">Preliminary share calculated from the audited workbook using actual Date-year grouping.</text><text x="38" y="327" font-family="Arial,sans-serif" font-size="13" fill="#a34c25">Currency, record validity, date/year anomalies and pivot reconciliation remain unresolved.</text></svg>