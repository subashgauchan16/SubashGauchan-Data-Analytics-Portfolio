<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
<title id="title">Starbucks FY2025 global company metrics</title><desc id="desc">40,990 stores at fiscal year end, 37.2 billion US dollars consolidated net revenue, and 7.9 percent GAAP operating margin, down 710 basis points year over year.</desc>
<rect width="1200" height="310" rx="22" fill="#f4f7fb"/><text x="42" y="48" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#17365d">STARBUCKS · FY2025 GLOBAL CONTEXT</text>
<g font-family="Arial,sans-serif"><rect x="35" y="75" width="355" height="175" rx="16" fill="#fff" stroke="#d9e2ef"/><text x="62" y="115" font-size="16" fill="#52637a">Stores at fiscal year-end</text><text x="62" y="173" font-size="43" font-weight="700" fill="#17365d">40,990</text><text x="62" y="211" font-size="14" fill="#52637a">Global store count</text>
<rect x="422" y="75" width="355" height="175" rx="16" fill="#fff" stroke="#d9e2ef"/><text x="449" y="115" font-size="16" fill="#52637a">Consolidated net revenue</text><text x="449" y="173" font-size="43" font-weight="700" fill="#17365d">$37.2bn</text><text x="449" y="211" font-size="14" fill="#52637a">US dollars · full fiscal year</text>
<rect x="809" y="75" width="355" height="175" rx="16" fill="#fff" stroke="#d9e2ef"/><text x="836" y="115" font-size="16" fill="#52637a">GAAP operating margin</text><text x="836" y="173" font-size="43" font-weight="700" fill="#17365d">7.9%</text><text x="836" y="211" font-size="14" fill="#a34c25">Down 710 basis points YoY</text>
<text x="42" y="282" font-size="13" fill="#52637a">Source: Starbucks FY2025 results release. Global corporate context only; not evidence of Nepal-specific demand.</text></g></svg>